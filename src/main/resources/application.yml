spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    database-platform: org.hibernate.dialect.MySQL8Dialect
    show-sql: true
    generate-ddl: true
    database: mysql
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true


  application:
    name: spring-ai
  ai:
    openai:
      api-key: ${API_KEY}
      url: https://api.openai.com/v1/chat/completions
      chat:
        options:
          model: gpt-4o-mini
          temperature: 1.5
          max-tokens: 700

