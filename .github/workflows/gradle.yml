name: Java CI with Gradle

on:
  push:
    branches: [ "dev" ]
  pull_request:
    branches: [ "dev" ]

jobs:
  build:
    runs-on: ubuntu-latest
    environment: dev
    env:
      API_KEY: ${{ secrets.API_KEY }}
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle Wrapper
        run: ./gradlew clean build -x test

      - name: Docker image build
        run: docker build --no-cache -t ${{ secrets.DOCKERHUB_USERNAME }}/spring-cicd-test:latest .

      - name: Docker login
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Docker Hub push
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/spring-cicd-test:latest

  run-docker-image-on-ec2:
    needs: build
    runs-on: self-hosted
    environment: dev

    steps:
      - name: Checkout code on runner
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create .env file for Docker Compose
        working-directory: ${{ github.workspace }}
        run: |
          cat <<EOF > .env
          MYSQL_ROOT_PASSWORD=${{ secrets.MYSQL_ROOT_PASSWORD }}
          MYSQL_DATABASE=${{ secrets.MYSQL_DATABASE }}
          MYSQL_USER=${{ secrets.MYSQL_USER }}
          MYSQL_PASSWORD=${{ secrets.MYSQL_PASSWORD }}
          DB_URL=${{ secrets.DB_URL }}
          DB_USER=${{ secrets.DB_USER }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          API_KEY=${{ secrets.API_KEY }}
          EOF
          echo "✅ .env file created successfully"
          echo "---"
          cat .env

      - name: Pull latest image
        run: sudo docker pull ${{ secrets.DOCKERHUB_USERNAME }}/spring-cicd-test:latest

      - name: Clean up old Docker containers & images
        run: |
          sudo docker compose -f docker-compose.prod.yml down || true
          sudo docker system prune -af || true

      - name: Start Docker containers
        working-directory: ${{ github.workspace }}
        run: sudo docker compose -f docker-compose.prod.yml up -d
